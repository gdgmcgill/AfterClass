[project]
name = "afterclass-ingestion"
version = "0.1.0"
description = "AfterClass data ingestion tooling"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "supabase>=2.0",
  "tenacity>=9.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
