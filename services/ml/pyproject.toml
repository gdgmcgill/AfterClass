[project]
name = "afterclass-ml"
version = "0.1.0"
description = "AfterClass recommendation and classification service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "pydantic-settings>=2.0",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.0", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
